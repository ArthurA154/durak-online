services:
  api:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: durak-api
    env_file: [.env]
    restart: unless-stopped
    networks: [edge]
    volumes:
      - durak-data:/app/data
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:3002/health || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 5

networks:
  edge:
    external: true

volumes:
  # Statistik der Admin-Seite (stats.json) – bleibt bei Updates erhalten
  durak-data:
