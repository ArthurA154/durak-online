name: Frontend auf GitHub Pages

on:
  push:
    branches: [main]
    paths: [frontend/**, shared/**, package-lock.json, .github/workflows/deploy-frontend.yml]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --workspace frontend --include-workspace-root
      # Pages-Adresse: https://arthura154.github.io/durak-online/
      - run: npm run build -w frontend -- --base=/durak-online/
        env:
          VITE_API_URL: https://durak-api.bitfix.ch
      - run: cp frontend/dist/index.html frontend/dist/404.html
      - uses: actions/upload-pages-artifact@v3
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
